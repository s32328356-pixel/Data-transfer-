<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xender Clone - Offline Share</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 {
            color: #f59e0b;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .home-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 420px;
            margin: 0 auto;
            text-align: left;
        }
        .section-title {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .home-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .app-icon-box {
            background: #334155;
            border: 2px dashed #f59e0b;
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #f59e0b;
            font-weight: bold;
            transition: 0.2s;
        }
        .app-icon-box:active {
            background: #f59e0b;
            color: #0f172a;
        }
        input[type="file"] {
            display: none;
        }
        .transfer-card {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .btn {
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:active {
            background-color: #d97706;
        }
        #status {
            font-weight: bold;
            color: #34d399;
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
        .download-link {
            display: block;
            margin-top: 12px;
            padding: 12px;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Xender Home Share</h1>
    <div class="subtitle">Sender: Turn on Hotspot | Receiver: Connect Wi-Fi</div>
    
    <div class="home-container">
        <div class="section-title">📱 Home Screen Categories</div>
        <p style="font-size: 12px; color: #cbd5e1; margin-top:0;">Tap any category to select and send apps/files instantly without data:</p>
        
        <div class="home-grid">
            <div class="app-icon-box" onclick="openFilePicker()">📦 Apps (APK)</div>
            <div class="app-icon-box" onclick="openFilePicker()">🖼️ Photos</div>
            <div class="app-icon-box" onclick="openFilePicker()">🎵 Music</div>
            <div class="app-icon-box" onclick="openFilePicker()">🎬 Videos</div>
            <div class="app-icon-box" onclick="openFilePicker()">📁 Files</div>
            <div class="app-icon-box" onclick="openFilePicker()">📂 Folders</div>
        </div>

        <!-- Hidden Native File Selector -->
        <input type="file" id="file-selector" onchange="onFileChosen()">

        <div class="transfer-card" id="transfer-card">
            <div style="font-size: 13px; color: #e2e8f0; word-break: break-all;" id="file-name-display"></div>
            <button class="btn" onclick="generateTransferLink()">Send via Hotspot</button>
            <p id="status">Status: Ready to send</p>
            
            <div id="receive-section" style="display:none;">
                <a id="download-btn" class="download-link" href="#" download>Download on Connected Phone</a>
            </div>
        </div>
    </div>

    <script>
        let chosenFile = null;

        function openFilePicker() {
            document.getElementById('file-selector').click();
        }

        function onFileChosen() {
            const fileInput = document.getElementById('file-selector');
            if (fileInput.files.length > 0) {
                chosenFile = fileInput.files[0];
                document.getElementById('transfer-card').style.display = "block";
                document.getElementById('file-name-display').innerText = "Selected: " + chosenFile.name;
                document.getElementById('status').innerText = "File loaded successfully!";
            }
        }

        function generateTransferLink() {
            if (!chosenFile) return;

            // Creating local blob URL for sharing over local hotspot network
            const fileURL = URL.createObjectURL(chosenFile);
            
            document.getElementById('receive-section').style.display = "block";
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.href = fileURL;
            downloadBtn.download = chosenFile.name;

            document.getElementById('status').innerText = "Link Generated! Open this app page on the other connected phone to download.";
        }
    </script>
</body>
</html>
